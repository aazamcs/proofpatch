name: Verify ProofPatch
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/system
      - run: python -m pytest tests/repro tests/acceptance
        env:
          PROOFPATCH_VARIANT: candidate
